name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json
      # The parseability gate: sync-katas.mjs fails on any markdown drift out
      # of MARKDOWN-FORMAT.md, then regenerates build/katas.json.
      - name: Parse katas + regenerate build/katas.json
        run: npm run sync
        working-directory: runner
      - name: Fail if build/katas.json is stale
        run: |
          git diff --exit-code -- build/katas.json || {
            echo "::error::build/katas.json is out of date with the markdown — cd runner && npm run sync, then commit the result (see MARKDOWN-FORMAT.md)"
            exit 1
          }
      - name: Typecheck + build the app
        working-directory: runner
        run: |
          npm ci
          npm run vendor:pyodide
          npm run build
