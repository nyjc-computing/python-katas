<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f172a'/%3E%3Ctext x='8' y='12' font-size='10' font-family='monospace' fill='%237dd3fc' text-anchor='middle'%3E%E2%96%B6%3C/text%3E%3C/svg%3E" />
    <title>Python Katas</title>
  </head>
  <body>
    <header id="toolbar">
      <button id="btn-menu" class="hamburger" title="Open the kata browser" aria-label="Toggle the side panel" aria-expanded="false">
        <span class="icon-menu" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.5 3h13v1.6h-13V3Zm0 4.2h13v1.6h-13V7.2Zm0 4.2h13V13h-13v-1.6Z" fill="currentColor"/></svg></span>
        <span class="icon-collapse" aria-hidden="true">&#8249;</span>
      </button>
      <span id="brand">Python Katas</span>
      <button id="btn-run" title="Run (Ctrl+Enter)">&#9654; Run</button>
      <button id="btn-verify" title="Select a kata to verify" disabled>&#10003; Verify</button>
      <span class="spacer"></span>
      <span id="run-status" aria-live="polite"></span>
      <label for="indent-select" id="indent-label" title="Indent width (spaces)">Indent</label>
      <select id="indent-select" title="Indent width (spaces)">
        <option value="2">2 spaces</option>
        <option value="4" selected>4 spaces</option>
      </select>
      <button id="btn-layout" title="Toggle editor/output layout">Layout: stacked</button>
      <button id="btn-katapane" class="hamburger" title="Show kata info" aria-label="Toggle the kata info panel" aria-expanded="false">
        <span class="icon-menu" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="4.6" r="1" fill="currentColor"/><rect x="7.2" y="6.6" width="1.6" height="5.2" rx="0.8" fill="currentColor"/></svg></span>
        <span class="icon-collapse" aria-hidden="true">&#8250;</span>
      </button>
    </header>

    <main id="app" class="layout-stack">
      <aside id="panel-left" class="panel-side">
        <div class="rail-label" id="left-rail-label">Kata browser</div>
        <div class="side-head">
          <span class="side-tabs">
            <button id="tab-katas" class="side-tab" type="button">Katas</button>
            <button id="tab-files" class="side-tab active" type="button">Files</button>
          </span>
          <span class="side-actions" id="kata-actions" hidden>
            <button id="btn-reset" class="danger" title="Reset all kata progress — verified ticks, saved code and counters">Reset</button>
          </span>
          <span class="side-actions" id="file-actions">
            <button id="btn-upload" class="side-action" title="Upload text files from this computer">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 3 3.5 7.5 5 9l2-2v6h2V7l2 2 1.5-1.5L8 3Z" fill="currentColor"/></svg>
            </button>
            <button id="btn-zip" class="side-action" title="Download all files as a zip">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1v2h1v1H8v1h1v1H8v1h1v1H7V2h1V1Zm3 8.5L8 12 5 9.5 6.5 8 8 9.5 9.5 8 11 9.5ZM3 12h10v2H3v-2Z" fill="currentColor"/></svg>
            </button>
          </span>
        </div>
        <div id="kata-view" hidden>
          <div id="kata-summary"></div>
          <ul id="kata-list"></ul>
          <div class="side-foot">pick a kata to work on it</div>
        </div>
        <div id="file-view">
        <div id="new-file-row">
          <input id="new-file-name" placeholder="new file, e.g. data.csv" spellcheck="false" aria-label="New file name" />
          <button id="btn-create" title="Create file">+</button>
        </div>
        <div id="file-hint" hidden></div>
        <ul id="file-list"></ul>
        <div class="side-foot">drop text files here</div>
        <input id="upload-input" type="file" multiple accept=".py,.csv,.json,.md,.html,.css,.txt" hidden />
        </div>
      </aside>

      <section id="editor-pane" class="pane">
        <div class="pane-title">
          <span id="active-file-name">main.py</span>
          <span id="save-state" data-state="saved">&#10003; saved</span>
        </div>
        <div id="editor"></div>
        <div id="editor-status">Ln 1, Col 1</div>
      </section>

      <section id="output-pane" class="pane">
        <div class="pane-title console-title"><span>console</span><button id="btn-clear" title="Clear the console">Clear</button></div>
        <div id="console"></div>
        <div id="console-input-row" hidden>
          <span class="console-caret" aria-hidden="true">&#8250;</span>
          <input id="console-input" autocomplete="off" spellcheck="false" aria-label="Program input" />
        </div>
      </section>

      <!-- Kata info: question, features and hints for the active kata -->
      <aside id="panel-right" class="panel-side">
        <div class="rail-label">Kata info</div>
        <div class="side-head">KATA</div>
        <div class="kata-pane">
          <div id="kata-pane-empty" class="kata-pane-empty">Select a kata to see its text and hints.</div>
          <div id="kata-pane-body" hidden>
            <div id="kata-pane-title"></div>
            <div id="kata-question" class="kata-question"></div>
            <div id="kata-hints-wrap" hidden>
              <div class="kata-hints-header">Hints</div>
              <div id="kata-hints-list"></div>
            </div>
            <div id="kata-features-wrap" hidden>
              <div class="kata-hints-header">Features practised</div>
              <div id="kata-features" class="kata-features"></div>
            </div>
          </div>
        </div>
      </aside>
    </main>

    <!-- On header-less hosts (GitHub Pages) this service worker injects
         COOP/COEP and reloads once, so SharedArrayBuffer works. It is a
         no-op where the server already sends the headers. -->
    <script src="/coi-serviceworker.js"></script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
